<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MeetChat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash">
  <div class="splash-logo">MeetChat</div>
  <div class="splash-bar"><div id="splashFill"></div></div>
  <div class="splash-from">From INNO</div>
</div>

<div id="offlineBar" class="hidden">You're offline - messages will be sent when you're back online</div>
<div id="toast"></div>

<div id="authScreen" class="screen hidden">
  <div class="auth-card">
    <h1>MeetChat</h1>
    <p class="sub">End-to-End Encrypted</p>
    <div class="auth-tabs">
      <button id="tabLoginBtn" class="active" onclick="showAuth('login')">Login</button>
      <button id="tabRegBtn" onclick="showAuth('register')">Create Account</button>
    </div>

    <div id="loginForm">
      <label>Phone Number</label>
      <div class="phone-row">
        <select id="loginCountry">
          <option value="+256">UG 🇺🇬 +256</option>
          <option value="+254">KE 🇰🇪 +254</option>
          <option value="+255">TZ 🇹🇿 +255</option>
          <option value="+250">RW 🇷🇼 +250</option>
          <option value="+1">US 🇺🇸 +1</option>
          <option value="+44">UK 🇬🇧 +44</option>
          <option value="+91">IN 🇮🇳 +91</option>
          <option value="+234">NG 🇳🇬 +234</option>
        </select>
        <input id="loginPhone" type="tel" placeholder="700 000 000">
      </div>
      <label>Password</label>
      <input id="loginPass" type="password" placeholder="Password">
      <button class="primary" onclick="doLogin()">Log In</button>
      <button class="link" onclick="showForgot()">Forgot Password?</button>
    </div>

    <div id="registerForm" class="hidden">
      <label>Username</label>
      <input id="regUser" type="text" placeholder="e.g inno_256" maxlength="20">
      <label>Phone Number</label>
      <div class="phone-row">
        <select id="regCountry">
          <option value="+256">UG 🇺🇬 +256</option>
          <option value="+254">KE 🇰🇪 +254</option>
          <option value="+255">TZ 🇹🇿 +255</option>
          <option value="+250">RW 🇷🇼 +250</option>
          <option value="+1">US 🇺🇸 +1</option>
          <option value="+44">UK 🇬🇧 +44</option>
          <option value="+91">IN 🇮🇳 +91</option>
          <option value="+234">NG 🇳🇬 +234</option>
        </select>
        <input id="regPhone" type="tel" placeholder="700 000 000">
      </div>
      <label>Password</label>
      <input id="regPass" type="password" placeholder="Create password">
      <label>Security Question</label>
      <select id="regQ">
        <option>What is your mother's name?</option>
        <option>What is your first pet's name?</option>
        <option>What city were you born in?</option>
      </select>
      <input id="regA" type="text" placeholder="Your answer">
      <button class="primary" onclick="doRegister()">Create Account</button>
      <p class="tiny">No OTP. Your details are saved securely.</p>
    </div>

    <div id="forgotForm" class="hidden">
      <label>Username</label>
      <input id="forgotUser" type="text" placeholder="Your username">
      <label>Security Answer</label>
      <input id="forgotAns" type="text" placeholder="Answer to security question">
      <label>New Password</label>
      <input id="forgotNewPass" type="password" placeholder="New password">
      <button class="primary" onclick="doForgot()">Recover Account</button>
      <button class="link" onclick="showAuth('login')">Back to Login</button>
    </div>
  </div>
</div>

<div id="mainScreen" class="screen hidden">
  <div class="topbar">
    <div><h1>MeetChat</h1><div id="myStatusLine">Online</div></div>
    <div class="top-actions">
      <span id="ghostBadge" class="hidden">Ghost</span>
      <img id="myAvatarTop" src="https://ui-avatars.com/api/?name=M&background=0A2540&color=fff" onclick="openTab('settings')">
    </div>
  </div>
  <div id="statusRow" class="status-row">
    <div class="status-item mine" onclick="addStatus()">
      <img id="myStatusImg" src="https://ui-avatars.com/api/?name=Me&background=0A2540&color=fff"><span>My Status</span>
    </div>
    <div id="statusList"></div>
  </div>

  <div id="tab-chats" class="tab-content">
    <div class="search"><input id="searchChat" placeholder="Search chats..." oninput="renderChats()"></div>
    <div id="chatList"></div>
  </div>

  <div id="tab-add" class="tab-content hidden">
    <div class="search"><input id="searchUser" placeholder="Search users..." oninput="renderUsers()"></div>
    <div id="userList"></div>
  </div>

  <div id="tab-settings" class="tab-content hidden">
    <div class="profile-card">
      <img id="setAvatar" src="https://ui-avatars.com/api/?name=M&background=0A2540&color=fff">
      <input id="setPic" type="text" placeholder="Profile picture link">
      <input id="setName" type="text" placeholder="Your name">
      <input id="setAbout" type="text" placeholder="About - Hey there, I am using MeetChat">
      <button class="primary" onclick="saveProfile()">Save Profile</button>
    </div>
    <div class="setting-group">
      <h3>Theme</h3>
      <button onclick="setTheme('light')">White Mode</button>
      <button onclick="setTheme('dark')">Dark Blue Mode</button>
      <button onclick="toggleLite()">Lite Mode: <span id="liteState">Off</span> - Data Saver</button>
      <button onclick="toggleGhost()">Ghost Mode: <span id="ghostState">Off</span> - App Airplane Mode</button>
    </div>
    <div class="setting-group">
      <h3>Privacy</h3>
      <button onclick="togglePrivacy('lastseen')">Hide Last Seen: <span id="hideLastSeen">Off</span></button>
      <button onclick="togglePrivacy('online')">Hide Online: <span id="hideOnline">Off</span></button>
      <button onclick="showBlocked()">See Who Blocked You</button>
    </div>
    <div class="setting-group">
      <h3>Security & Account</h3>
      <button onclick="toggleAppLock()">App Lock (Pattern): <span id="lockState">Off</span></button>
      <button onclick="switchAccount()">Switch Account - 2 Accounts</button>
      <button onclick="buyBlueTick()">Get Blue Tick - Payment</button>
      <button onclick="toast('Feedback sent to INNO. Thank you!')">Send Feedback</button>
      <button onclick="toast('Report sent to Admin')">Report to Admin</button>
      <button onclick="toast('Notifications: ON')">Notifications</button>
      <button onclick="toast('You are on latest version')">Updates</button>
      <button onclick="shareApp()">Share App</button>
      <button class="danger" onclick="logout()">Log Out</button>
    </div>
  </div>

  <div class="bottom-tabs">
    <button id="btn-chats" class="active" onclick="openTab('chats')"><span class="tab-icon">◉</span><label>Chats</label></button>
    <button id="btn-add" onclick="openTab('add')"><span class="tab-icon">＋</span><label>Add Chat</label></button>
    <button id="btn-settings" onclick="openTab('settings')"><span class="tab-icon">⚙</span><label>Settings</label></button>
  </div>
</div>

<div id="chatWindow" class="screen hidden">
  <div class="chat-header">
    <button onclick="closeChat()">‹</button>
    <img id="chatAvatar" src="">
    <div class="flex1"><b id="chatName"></b><small id="chatPresence">Offline</small><small id="typingInd"></small></div>
    <button onclick="startCall('voice')">📞</button>
    <button onclick="startCall('video')">📹</button>
    <button onclick="toggleBlock()">Block</button>
  </div>
  <div class="chat-tools">
    <label>Disappearing: <select id="disappearSelect"><option value="0">Off</option><option value="10">10s</option><option value="60">1 min</option></select></label>
    <button onclick="toast('Screenshot allowed for profile pictures')">Profile Pic</button>
  </div>
  <div id="messages"></div>
  <div class="composer">
    <button onclick="document.getElementById('fileInput').click()">📎</button>
    <input id="fileInput" type="file" accept="image/*,video/*" class="hidden" onchange="sendFile(this)">
    <button onclick="insertEmoji('😂')">😊</button>
    <input id="msgInput" placeholder="Message..." oninput="sendTyping()">
    <button onclick="toggleVoice()">🎤</button>
    <button class="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<div id="callScreen" class="screen hidden call-screen">
  <img id="callAvatar" src="">
  <h2 id="callName"></h2>
  <p id="callStatus">Ringing...</p>
  <p id="callTimer">00:00</p>
  <div class="call-btns"><button class="accept" onclick="acceptCall()">Accept</button><button class="decline" onclick="endCall()">End</button></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="app.js"></script>
</body>
   </html>
