<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#0a84ff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>MeetChat</title>
<style>
/* ============================================================
   THEME TOKENS  (iPhone-like)
   ============================================================ */
:root{
  --bg:#f2f2f7; --card:#ffffff; --sep:#e3e3e8; --txt:#000; --txt2:#8a8a8e;
  --blue:#0a84ff; --blue-d:#0060df; --green:#34c759; --red:#ff3b30;
  --bubble-in:#e9e9eb; --bubble-in-txt:#000;
  --bubble-out:#0a84ff; --bubble-out-txt:#fff;
  --nav:rgba(249,249,249,.82); --field:#efeff4;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
[data-theme="dark"]{
  --bg:#0b1020; --card:#141b2e; --sep:#243049; --txt:#f5f7ff; --txt2:#8b96b0;
  --blue:#0a84ff; --blue-d:#0a84ff;
  --bubble-in:#1e2740; --bubble-in-txt:#f5f7ff;
  --bubble-out:#0a84ff; --bubble-out-txt:#fff;
  --nav:rgba(15,21,38,.86); --field:#1b2338;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.35;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font-family:inherit;font-size:16px;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{outline:none}
.hidden{display:none !important}
.center{display:flex;align-items:center;justify-content:center}

/* ============================================================
   SPLASH
   ============================================================ */
#splash{
  position:fixed;inset:0;z-index:9000;background:#0b1020;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .45s ease, visibility .45s;
}
#splash.gone{opacity:0;visibility:hidden}
.splash-logo{
  font-size:34px;font-weight:700;letter-spacing:-.5px;color:#fff;
  font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;
}
.splash-logo span{color:#0a84ff}
.splash-bar{
  width:132px;height:2.5px;border-radius:2px;background:rgba(255,255,255,.16);
  margin-top:22px;overflow:hidden;
}
.splash-bar i{
  display:block;height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,#0a84ff,#4facff);
  animation:splashLoad 2.2s cubic-bezier(.5,.05,.3,1) forwards;
}
@keyframes splashLoad{0%{width:0}45%{width:62%}100%{width:100%}}
.splash-from{
  position:absolute;bottom:calc(34px + var(--safe-b));
  font-size:12px;letter-spacing:2.4px;text-transform:uppercase;
  color:rgba(255,255,255,.42);font-weight:500;
}

/* ============================================================
   OFFLINE
   ============================================================ */
#offline{
  position:fixed;inset:0;z-index:8000;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px;gap:14px;
}
#offline svg{width:64px;height:64px;stroke:var(--txt2);opacity:.9}
#offline h2{margin:6px 0 0;font-size:20px;font-weight:600}
#offline p{margin:0;max-width:320px;color:var(--txt2);font-size:14.5px;line-height:1.5}
#offline .retry{
  margin-top:12px;padding:11px 26px;border-radius:12px;background:var(--blue);
  color:#fff;font-weight:600;font-size:15px;
}

/* ============================================================
   AUTH
   ============================================================ */
.auth{
  min-height:100%;display:flex;flex-direction:column;justify-content:center;
  padding:calc(28px + var(--safe-t)) 22px calc(28px + var(--safe-b));
  max-width:460px;margin:0 auto;
}
.auth h1{font-size:30px;font-weight:700;margin:0 0 4px;letter-spacing:-.6px}
.auth .sub{color:var(--txt2);margin:0 0 26px;font-size:15px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--txt2);
  text-transform:uppercase;letter-spacing:.5px;margin:0 0 7px 3px}
.inp{
  width:100%;padding:14px 15px;border-radius:13px;background:var(--field);
  border:1px solid transparent;font-size:16px;transition:border-color .15s,background .15s;
}
.inp:focus{border-color:var(--blue);background:var(--card)}
.phone-row{display:flex;gap:9px}
.cc-btn{
  display:flex;align-items:center;gap:6px;padding:0 13px;border-radius:13px;
  background:var(--field);font-weight:600;font-size:15px;white-space:nowrap;min-height:50px;
}
.cc-btn .flag{font-size:19px;line-height:1}
.btn{
  width:100%;padding:15px;border-radius:14px;font-weight:600;font-size:16.5px;
  background:var(--field);color:var(--txt);transition:transform .08s,opacity .15s;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:disabled{opacity:.5}
.btn.danger{background:rgba(255,59,48,.12);color:var(--red)}
.link{display:block;width:100%;text-align:center;padding:13px 0;color:var(--blue);
  font-size:15px;font-weight:500;background:none}
.auth .divider{height:1px;background:var(--sep);margin:18px 0}
.err{
  background:rgba(255,59,48,.1);color:var(--red);padding:11px 14px;border-radius:11px;
  font-size:14px;margin-bottom:14px;display:none;
}
.err.show{display:block}
.qa-row{margin-bottom:12px}
.qa-row .qn{font-size:13.5px;color:var(--txt2);margin:0 0 6px 3px}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{height:100%;display:flex;flex-direction:column;padding-bottom:calc(56px + var(--safe-b))}
#topbar{
  position:sticky;top:0;z-index:60;padding:calc(10px + var(--safe-t)) 16px 10px;
  background:var(--nav);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
#topbar h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.4px}
#topbar .actions{display:flex;gap:14px;align-items:center}
.icon-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:var(--field)}
.icon-btn svg{width:22px;height:22px;stroke:var(--blue);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view{display:none}
.view.active{display:block}

/* tab bar */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:70;height:calc(56px + var(--safe-b));
  padding-bottom:var(--safe-b);display:flex;
  background:var(--nav);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--txt2);position:relative;
}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10px;font-weight:500;letter-spacing:.1px}
.tab.active{color:var(--blue)}
.tab .badge{
  position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;
  border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

/* rows */
.row{
  display:flex;align-items:center;gap:13px;padding:10px 16px;
  border-bottom:.5px solid var(--sep);background:var(--card);
}
.row:active{background:var(--field)}
.row .body{flex:1;min-width:0}
.row .title{font-weight:600;font-size:16px;display:flex;align-items:center;gap:6px}
.row .sub{font-size:14px;color:var(--txt2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:2px}
.row .meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.row .time{font-size:12.5px;color:var(--txt2)}
.list{background:var(--card)}
.list-head{
  padding:16px 16px 7px;font-size:12.5px;font-weight:600;color:var(--txt2);
  text-transform:uppercase;letter-spacing:.6px;background:var(--bg);
}
.empty{padding:52px 28px;text-align:center;color:var(--txt2);font-size:14.5px;line-height:1.6}
.empty svg{width:52px;height:52px;stroke:var(--txt2);fill:none;stroke-width:1.4;
  opacity:.5;margin-bottom:12px}

/* avatars */
.av{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;position:relative;
  background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:19px;overflow:visible;user-select:none;
}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av.sm{width:34px;height:34px;font-size:13px}
.av.lg{width:84px;height:84px;font-size:31px}
.av .dot{
  position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-radius:50%;
  background:var(--green);border:2.5px solid var(--card);
}
.av .dot.off{background:#b6b6bb}

/* status rail */
#statusRail{
  display:flex;gap:14px;overflow-x:auto;padding:12px 16px;background:var(--card);
  border-bottom:.5px solid var(--sep);scrollbar-width:none;
}
#statusRail::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:5px;width:66px;flex-shrink:0}
.story .ring{
  width:58px;height:58px;border-radius:50%;padding:2.5px;
  background:linear-gradient(135deg,#0a84ff,#5e5ce6);position:relative;
}
.story .ring.seen{background:var(--sep)}
.story .ring .av{width:100%;height:100%;font-size:20px}
.story .nm{font-size:11px;color:var(--txt2);max-width:64px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:center}
.story .plus{
  position:absolute;right:-2px;bottom:-2px;width:21px;height:21px;border-radius:50%;
  background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:600;border:2px solid var(--card);
}

/* ============================================================
   CHAT SCREEN
   ============================================================ */
#chatScreen{
  position:fixed;inset:0;z-index:200;background:var(--bg);
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
}
#chatScreen.open{transform:translateX(0)}
#chatHead{
  display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-t)) 12px 8px;
  background:var(--nav);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);flex-shrink:0;z-index:5;
}
#chatHead .back{display:flex;align-items:center;gap:2px;color:var(--blue);font-size:16px}
#chatHead .back svg{width:20px;height:20px;stroke:var(--blue);fill:none;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round}
#chatHead .who{flex:1;min-width:0;display:flex;align-items:center;gap:9px}
#chatHead .nm{font-weight:600;font-size:16px;line-height:1.15}
#chatHead .st{font-size:12px;color:var(--txt2);margin-top:1px}
#chatHead .st.typing{color:var(--blue)}
#msgs{
  flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:3px;
  -webkit-overflow-scrolling:touch;
}
.daysep{align-self:center;font-size:12px;color:var(--txt2);background:var(--card);
  padding:4px 12px;border-radius:11px;margin:12px 0 8px;box-shadow:var(--shadow)}
.msg{max-width:78%;display:flex;flex-direction:column;position:relative}
.msg.out{align-self:flex-end;align-items:flex-end}
.msg.in{align-self:flex-start;align-items:flex-start}
.bub{
  padding:9px 13px;border-radius:19px;font-size:16px;line-height:1.32;
  word-break:break-word;white-space:pre-wrap;position:relative;
  box-shadow:0 1px 1px rgba(0,0,0,.05);
}
.msg.out .bub{background:var(--bubble-out);color:var(--bubble-out-txt);border-bottom-right-radius:6px}
.msg.in  .bub{background:var(--bubble-in);color:var(--bubble-in-txt);border-bottom-left-radius:6px}
.msg .foot{
  display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt2);
  margin:3px 5px 0;
}
.msg .foot .ticks svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.msg .foot .ticks.seen{color:var(--blue)}
.bub img.media{max-width:230px;border-radius:13px;display:block;cursor:pointer}
.bub .del{
  font-style:italic;color:var(--txt2);display:flex;align-items:center;gap:8px;font-size:14.5px;
}
.bub .del button{color:var(--blue);font-weight:600;font-size:13px;text-decoration:underline}
.bub .edited{font-size:11px;opacity:.7;margin-left:6px}
.bub .viewonce{position:relative}
.bub .viewonce .tag{
  position:absolute;top:7px;left:7px;background:rgba(0,0,0,.55);color:#fff;
  font-size:11px;padding:3px 8px;border-radius:9px;font-weight:600;
}
#composer{
  display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(8px + var(--safe-b));
  background:var(--nav);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);flex-shrink:0;
}
#composer .plus{
  width:34px;height:34px;border-radius:50%;background:var(--field);color:var(--blue);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:1px;
}
#composer .plus svg{width:20px;height:20px;stroke:var(--blue);fill:none;stroke-width:2.4;
  stroke-linecap:round}
#msgInput{
  flex:1;resize:none;max-height:110px;padding:9px 14px;border-radius:19px;
  background:var(--field);border:1px solid transparent;line-height:1.35;font-size:16px;
}
#msgInput:focus{border-color:var(--blue)}
.send{
  width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:1px;
  transition:opacity .15s;
}
.send:disabled{opacity:.35}
.send svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round}
.recording{color:var(--red);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.recording .blink{width:9px;height:9px;border-radius:50%;background:var(--red);
  animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

/* sheets & modals */
.sheet-bg{
  position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.42);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:520px;background:var(--card);border-radius:20px 20px 0 0;
  padding:8px 0 calc(10px + var(--safe-b));animation:up .24s cubic-bezier(.32,.72,0,1);
  max-height:82vh;display:flex;flex-direction:column;
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h3{margin:12px 20px 10px;font-size:17px;font-weight:600}
.sheet .item{
  padding:15px 20px;font-size:16.5px;display:flex;align-items:center;gap:13px;
  border-top:.5px solid var(--sep);
}
.sheet .item:active{background:var(--field)}
.sheet .item.danger{color:var(--red)}
.sheet .item svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.sheet .scroller{overflow-y:auto;flex:1}
.modal-bg{
  position:fixed;inset:0;z-index:650;background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;padding:22px;animation:fade .18s;
}
.modal{
  width:100%;max-width:420px;background:var(--card);border-radius:18px;padding:20px;
  max-height:80vh;display:flex;flex-direction:column;animation:pop .2s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{margin:0 0 14px;font-size:18px;font-weight:600}
.modal .acts{display:flex;gap:10px;margin-top:16px}
.modal .acts .btn{flex:1}

/* country picker */
.search{
  width:100%;padding:11px 14px;border-radius:11px;background:var(--field);
  border:1px solid transparent;margin-bottom:10px;font-size:15.5px;
}
.search:focus{border-color:var(--blue)}
.c-list{overflow-y:auto;flex:1;margin:0 -20px}
.c-item{display:flex;align-items:center;gap:12px;padding:12px 20px;font-size:16px}
.c-item:active{background:var(--field)}
.c-item .fl{font-size:22px}
.c-item .dc{margin-left:auto;color:var(--txt2);font-size:14.5px}

/* toasts */
#toasts{position:fixed;top:calc(12px + var(--safe-t));left:0;right:0;z-index:9500;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{
  background:rgba(28,28,30,.95);color:#fff;padding:11px 18px;border-radius:14px;
  font-size:14px;font-weight:500;max-width:400px;text-align:center;
  box-shadow:0 6px 24px rgba(0,0,0,.28);animation:tin .28s cubic-bezier(.2,.9,.3,1.2);
  backdrop-filter:blur(12px);
}
.toast.ok{background:rgba(52,199,89,.96)}
.toast.err{background:rgba(255,59,48,.96)}
@keyframes tin{from{transform:translateY(-16px) scale(.94);opacity:0}to{transform:none;opacity:1}}

/* profile / settings */
.prof-head{display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:26px 16px 20px;background:var(--card);border-bottom:.5px solid var(--sep)}
.prof-head .nm{font-size:21px;font-weight:700}
.prof-head .ab{font-size:14px;color:var(--txt2);text-align:center;max-width:280px}
.switch{width:51px;height:31px;border-radius:16px;background:#c7c7cc;position:relative;
  transition:background .2s;flex-shrink:0}
.switch.on{background:var(--green)}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
  background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on i{transform:translateX(20px)}
.chev{width:8px;height:13px;stroke:var(--txt2);fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.val{color:var(--txt2);font-size:15px}

/* lock screen */
#lockScreen{position:fixed;inset:0;z-index:8800;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
#lockScreen .pin-dots{display:flex;gap:14px}
#lockScreen .pin-dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--txt2)}
#lockScreen .pin-dots i.on{background:var(--txt);border-color:var(--txt)}
.keypad{display:grid;grid-template-columns:repeat(3,74px);gap:14px}
.keypad button{
  width:74px;height:74px;border-radius:50%;background:var(--field);font-size:26px;
  font-weight:400;display:flex;align-items:center;justify-content:center;
}
.keypad button:active{background:var(--sep)}
.keypad button.plain{background:none;font-size:15px;font-weight:600;color:var(--blue)}

/* status viewer */
#statusViewer{position:fixed;inset:0;z-index:700;background:#000;display:flex;
  flex-direction:column}
#statusViewer .bar{height:3px;background:rgba(255,255,255,.28);margin:calc(10px + var(--safe-t)) 10px 0;
  border-radius:2px;overflow:hidden}
#statusViewer .bar i{display:block;height:100%;width:0;background:#fff;border-radius:2px}
#statusViewer .head{display:flex;align-items:center;gap:11px;padding:12px 14px;color:#fff}
#statusViewer .head .nm{font-weight:600;font-size:15px}
#statusViewer .head .tm{font-size:12px;opacity:.7}
#statusViewer .content{flex:1;display:flex;align-items:center;justify-content:center;
  padding:24px;color:#fff;font-size:22px;text-align:center;line-height:1.45;
  word-break:break-word;white-space:pre-wrap}
#statusViewer .content img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain}
#statusViewer .foot{padding:16px 18px calc(20px + var(--safe-b));display:flex;gap:12px;
  align-items:center;color:#fff}
#statusViewer .foot button{color:#fff;font-size:14px;font-weight:600;opacity:.95}

/* call screen */
#callScreen{position:fixed;inset:0;z-index:750;background:linear-gradi
