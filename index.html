<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meet Chat</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#0f1115;color:white}
.top{padding:20px;text-align:center;background:#1a1d24}
.top h1{margin:0;font-size:32px}
.top p{color:#aaa;margin:5px 0}
.card{background:#1a1d24;margin:15px;padding:18px;border-radius:16px}
input,select{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#0f1115;color:white;font-size:15px}
button{width:100%;padding:14px;border:none;border-radius:12px;background:#25D366;color:#000;font-weight:bold;font-size:16px;cursor:pointer;margin-top:8px}
button.blue{background:#0084ff;color:white}
button.gray{background:#333;color:white}
.hidden{display:none}
.user{display:flex;align-items:center;gap:12px;padding:12px;background:#22262f;border-radius:12px;margin:8px 0;cursor:pointer}
.user img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#444}
.msg{max-width:80%;padding:10px 12px;border-radius:14px;margin:6px 0;font-size:15px}
.me{background:#25D366;color:#000;margin-left:auto}
.other{background:#2a2f3a}
#chatBox{height:55vh;overflow-y:auto;padding:10px}
.flex{display:flex;gap:8px}
.flex input{flex:1}
.flex button{width:80px}
#toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:20px;z-index:999;display:none;border:1px solid #444}
</style>
</head>
<body>
<div id="toast"></div>
<div class="top"><h1>MEET CHAT</h1><p>No OTP. Real Firebase. Works on all phones.</p><p id="status" style="color:#25D366;font-size:12px">Connecting...</p></div>

<!-- AUTH -->
<div id="authPage">
  <div class="card" id="createBox">
    <h2>Create Account</h2>
    <input id="c_phone" placeholder="Phone e.g 771234567">
    <input id="c_user" placeholder="Username e.g inno">
    <input id="c_pass" type="password" placeholder="Password min 6">
    <select id="c_q"><option>What is your mother's first name?</option><option>What is your pet name?</option><option>What is your birth town?</option></select>
    <input id="c_ans" placeholder="Security Answer e.g mama">
    <label style="font-size:13px;color:#aaa">Profile Picture (optional)</label>
    <input id="c_pic" type="file" accept="image/*">
    <button onclick="createAccount()">CREATE ACCOUNT</button>
    <button class="gray" onclick="showLogin()">Already have account? Login</button>
  </div>
  <div class="card hidden" id="loginBox">
    <h2>Login</h2>
    <input id="l_phone" placeholder="Phone">
    <input id="l_pass" type="password" placeholder="Password">
    <button onclick="login()">LOGIN</button>
    <button class="gray" onclick="showCreate()">No account? Create</button>
    <button class="gray" onclick="forgot()">Forgot Password? Reset with Security Answer</button>
  </div>
  <div class="card hidden" id="forgotBox">
    <h2>Reset Password</h2>
    <input id="f_phone" placeholder="Phone">
    <select id="f_q"><option>What is your mother's first name?</option><option>What is your pet name?</option><option>What is your birth town?</option></select>
    <input id="f_ans" placeholder="Security Answer">
    <input id="f_new" type="password" placeholder="New Password">
    <button onclick="resetPass()">RESET PASSWORD</button>
    <button class="gray" onclick="showLogin()">Back to Login</button>
  </div>
</div>

<!-- CHATS -->
<div id="mainPage" class="hidden">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b id="myName">Hi</b>
      <button style="width:auto;padding:8px 14px" class="gray" onclick="logout()">Logout</button>
    </div>
    <input id="searchUser" placeholder="Search username..." oninput="loadUsers()">
    <h3>All Users</h3>
    <div id="userList"></div>
  </div>
</div>

<!-- CHAT ROOM -->
<div id="chatPage" class="hidden">
  <div class="card">
    <button class="gray" onclick="backToList()">← Back</button>
    <h3 id="chatWith">Chat</h3>
    <div id="chatBox"></div>
    <div class="flex"><input id="msgInput" placeholder="Type message..."><button onclick="sendMsg()">Send</button></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, query, orderBy, onSnapshot, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBleFoBV36jw2mGbmZgO7lrFtG4VswtPk8",
  authDomain: "meetchat-cab0c.firebaseapp.com",
  projectId: "meetchat-cab0c",
  storageBucket: "meetchat-cab0c.firebasestorage.app",
  messagingSenderId: "722069770375",
  appId: "1:722069770375:web:e6d195f8476cb7b069e822"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
document.getElementById('status').innerText = "Connected to Firebase: meetchat-cab0c ✅";

let me = JSON.parse(localStorage.getItem('meetchat_me') || 'null');
let currentChatUser = null;
let unsub = null;

function toast(t){ const el=document.getElementById('toast'); el.innerText=t; el.style.display='block'; setTimeout(()=>el.style.display='none',3000); }
window.toast = toast;

window.showLogin = ()=>{ document.getElementById('createBox').classList.add('hidden'); document.getElementById('loginBox').classList.remove('hidden'); document.getElementById('forgotBox').classList.add('hidden'); }
window.showCreate = ()=>{ document.getElementById('createBox').classList.remove('hidden'); document.getElementById('loginBox').classList.add('hidden'); document.getElementById('forgotBox').classList.add('hidden'); }
window.forgot = ()=>{ document.getElementById('createBox').classList.add('hidden'); document.getElementById('loginBox').classList.add('hidden'); document.getElementById('forgotBox').classList.remove('hidden'); }

function fileToBase64(file){ return new Promise((res)=>{ if(!file) return res(""); const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file); }); }

window.createAccount = async ()=>{
  const phone=document.getElementById('c_phone').value.trim();
  const username=document.getElementById('c_user').value.trim().toLowerCase();
  const pass=document.getElementById('c_pass').value;
  const q=document.getElementById('c_q').value;
  const ans=document.getElementById('c_ans').value.trim().toLowerCase();
  const picFile=document.getElementById('c_pic').files[0];
  if(!phone||!username||!pass||!ans) return toast("Fill all fields");
  if(pass.length<6) return toast("Password min 6");
  toast("Creating...");
  try{
    const ref=doc(db,"users",phone);
    const snap=await getDoc(ref);
    if(snap.exists()) return toast("Phone already used, Login");
    const pic=await fileToBase64(picFile);
    const user={phone,username,pass,q,ans,pic,created:Date.now()};
    await setDoc(ref,user);
    me=user; localStorage.setItem('meetchat_me',JSON.stringify(user));
    toast("Account created! Welcome "+username);
    openMain();
  }catch(e){ toast("Error: "+e.message); }
};

window.login = async ()=>{
  const phone=document.getElementById('l_phone').value.trim();
  const pass=document.getElementById('l_pass').value;
  if(!phone||!pass) return toast("Fill phone + password");
  try{
    const snap=await getDoc(doc(db,"users",phone));
    if(!snap.exists()) return toast("No account for this phone");
    const u=snap.data();
    if(u.pass!==pass) return toast("Wrong password");
    me=u; localStorage.setItem('meetchat_me',JSON.stringify(u));
    toast("Welcome back "+u.username);
    openMain();
  }catch(e){ toast("Error: "+e.message); }
};

window.resetPass = async ()=>{
  const phone=document.getElementById('f_phone').value.trim();
  const q=document.getElementById('f_q').value;
  const ans=document.getElementById('f_ans').value.trim().toLowerCase();
  const np=document.getElementById('f_new').value;
  if(!phone||!ans||!np) return toast("Fill all");
  try{
    const ref=doc(db,"users",phone);
    const snap=await getDoc(ref);
    if(!snap.exists()) return toast("No account");
    const u=snap.data();
    if(u.q!==q||u.ans!==ans) return toast("Wrong security answer");
    u.pass=np; await setDoc(ref,u);
    toast("Password reset! Login now");
    showLogin();
  }catch(e){ toast("Error: "+e.message); }
};

window.logout = ()=>{ localStorage.removeItem('meetchat_me'); me=null; location.reload(); };
window.backToList = ()=>{ if(unsub) unsub(); document.getElementById('chatPage').classList.add('hidden'); document.getElementById('mainPage').classList.remove('hidden'); loadUsers(); };

function openMain(){
  document.getElementById('authPage').classList.add('hidden');
  document.getElementById('mainPage').classList.remove('hidden');
  document.getElementById('myName').innerText="Hi, "+me.username+" ("+me.phone+")";
  loadUsers();
}

window.loadUsers = async ()=>{
  const search=(document.getElementById('searchUser').value||"").toLowerCase();
  try{
    const snap=await getDocs(collection(db,"users"));
    let html="";
    snap.forEach(d=>{
      const u=d.data();
      if(u.phone===me.phone) return;
      if(search && !u.username.includes(search)) return;
      const img=u.pic||"https://via.placeholder.com/48";
      html+=`<div class="user" onclick='openChat("${u.phone}","${u.username}")'><img src="${img}"><div><b>${u.username}</b><br><small>${u.phone}</small></div></div>`;
    });
    document.getElementById('userList').innerHTML=html||"<p>No other users yet. Create another account on other phone.</p>";
  }catch(e){ document.getElementById('userList').innerHTML="Error: "+e.message; }
};

window.openChat = (phone,username)=>{
  currentChatUser={phone,username};
  document.getElementById('mainPage').classList.add('hidden');
  document.getElementById('chatPage').classList.remove('hidden');
  document.getElementById('chatWith').innerText="Chat with "+username;
  const chatId=[me.phone,phone].sort().join("_");
  const q=query(collection(db,"chats",chatId,"messages"),orderBy("time"));
  if(unsub) unsub();
  unsub=onSnapshot(q,(snap)=>{
    let html="";
    snap.forEach(d=>{
      const m=d.data();
      const cls=m.from===me.phone?"msg me":"msg other";
      html+=`<div class="${cls}"><b>${m.fromName}:</b> ${m.text}</div>`;
    });
    const box=document.getElementById('chatBox');
    box.innerHTML=html||"<p>Say hi!</p>";
    box.scrollTop=box.scrollHeight;
  });
};

window.sendMsg = async ()=>{
  const txt=document.getElementById('msgInput').value.trim();
  if(!txt||!currentChatUser) return;
  const chatId=[me.phone,currentChatUser.phone].sort().join("_");
  await addDoc(collection(db,"chats",chatId,"messages"),{from:me.phone,fromName:me.username,to:currentChatUser.phone,text:txt,time:Date.now()});
  document.getElementById('msgInput').value="";
};

if(me) openMain();
</script>
</body>
</html>
